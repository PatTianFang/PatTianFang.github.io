<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pat's Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard">
        <!-- Main Content Area -->
        <main class="content-area">
            <div class="hero-section" id="heroSection">
                <div class="hero-image"></div>
                <div class="hero-info">
                    <h1 class="hero-title">Welcome</h1>
                    <p class="hero-description">Select a destination below</p>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-container">
                <button class="nav-tile" data-id="gallery" data-title="Gallery" data-description="探索视觉作品集 · Explore visual collections">
                    <div class="tile-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                        </svg>
                    </div>
                    <span class="tile-label">Gallery</span>
                </button>

                <button class="nav-tile" data-id="note" data-title="Notes" data-description="阅读思考与记录 · Read thoughts and records">
                    <div class="tile-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                        </svg>
                    </div>
                    <span class="tile-label">Notes</span>
                </button>

                <button class="nav-tile" data-id="photo" data-title="Photos" data-description="发现精彩瞬间 · Discover amazing moments">
                    <div class="tile-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M21 6h-3.17L16 4h-6v2h5.12l1.83 2H21v12H5v-9H3v9c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM8 14c0 2.76 2.24 5 5 5s5-2.24 5-5-2.24-5-5-5-5 2.24-5 5zm5-3c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3zM5 6h3V4H5V1H3v3H0v2h3v3h2z"/>
                        </svg>
                    </div>
                    <span class="tile-label">Photos</span>
                </button>

                <button class="nav-tile nav-tile-home active" data-id="home" data-title="Welcome" data-description="Select a destination below">
                    <div class="tile-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                        </svg>
                    </div>
                    <span class="tile-label">Home</span>
                </button>
            </div>
        </nav>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
