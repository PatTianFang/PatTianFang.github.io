<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatFang</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Left Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <img src="assets/images/logo.png" alt="Logo" class="logo-image">
                <span>PatFang</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-section="home">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span>主页</span>
            </a>
            <a href="#" class="nav-item" data-section="apps">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/>
                </svg>
                <span>应用</span>
            </a>
            <a href="#" class="nav-item" data-section="featured">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
                <span>精选</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Search Bar -->
        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" id="searchInput" name="search" placeholder="搜索内容" class="search-input" autocomplete="off">
        </div>

        <!-- Hero Carousel Section -->
        <section class="hero-carousel" id="heroCarousel">
            <div class="carousel-container">
                <button class="carousel-btn prev" id="prevBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                </button>

                <div class="carousel-track" id="carouselTrack">
                    <div class="carousel-slide active">
                        <img src="assets/images/hero-gallery.jpg" alt="Gallery">
                        <div class="slide-content">
                            <span class="slide-badge">推荐</span>
                            <h2 class="slide-title">Gallery</h2>
                            <p class="slide-description">探索视觉作品集 · Explore visual collections</p>
                            <button class="slide-btn" data-url="https://gallery.patfang.xyz/">
                                <span>立即访问</span>
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                                </svg>
                            </button>
                        </div>
                        <div class="slide-overlay"></div>
                    </div>

                    <div class="carousel-slide">
                        <img src="assets/images/hero-notes.jpg" alt="Notes">
                        <div class="slide-content">
                            <span class="slide-badge">热门</span>
                            <h2 class="slide-title">Notes</h2>
                            <p class="slide-description">阅读思考与记录 · Read thoughts and records</p>
                            <button class="slide-btn" data-url="https://note.patfang.xyz/">
                                <span>立即访问</span>
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                                </svg>
                            </button>
                        </div>
                        <div class="slide-overlay"></div>
                    </div>

                    <div class="carousel-slide">
                        <img src="assets/images/hero-photos.jpg" alt="Photos">
                        <div class="slide-content">
                            <span class="slide-badge">新品</span>
                            <h2 class="slide-title">Photos</h2>
                            <p class="slide-description">发现精彩瞬间 · Discover amazing moments</p>
                            <button class="slide-btn" data-url="https://photo.patfang.xyz/">
                                <span>立即访问</span>
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                                </svg>
                            </button>
                        </div>
                        <div class="slide-overlay"></div>
                    </div>
                </div>

                <button class="carousel-btn next" id="nextBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </button>

                <div class="carousel-indicators" id="indicators"></div>
            </div>
        </section>

        <!-- Apps Grid Section -->
        <section class="apps-section">
            <div class="section-header">
                <h3 class="section-title">我的应用</h3>
                <a href="#" class="see-all">查看全部 →</a>
            </div>

            <div class="recommended-grid">
                <div class="recommended-card large" data-url="https://gallery.patfang.xyz/">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&q=80" alt="Gallery">
                    <div class="recommended-overlay"></div>
                    <div class="recommended-content">
                        <span class="recommended-badge">推荐</span>
                        <h4>Gallery</h4>
                        <p>探索视觉作品集</p>
                    </div>
                </div>

                <div class="recommended-card" data-url="https://note.patfang.xyz/">
                    <img src="https://images.unsplash.com/photo-1455390582262-044cdead277a?w=400&q=80" alt="Notes">
                    <div class="recommended-overlay"></div>
                    <div class="recommended-content">
                        <span class="recommended-badge">热门</span>
                        <h4>Notes</h4>
                        <p>阅读思考与记录</p>
                    </div>
                </div>

                <div class="recommended-card" data-url="https://photo.patfang.xyz/">
                    <img src="https://images.unsplash.com/photo-1471897488648-5eae4ac6686b?w=400&q=80" alt="Photos">
                    <div class="recommended-overlay"></div>
                    <div class="recommended-content">
                        <span class="recommended-badge">最新</span>
                        <h4>Photos</h4>
                        <p>发现精彩瞬间</p>
                    </div>
                </div>

                <!-- Placeholder for future apps -->
                <div class="recommended-card placeholder">
                    <div class="placeholder-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                        </svg>
                    </div>
                    <div class="recommended-content">
                        <h4>即将推出</h4>
                        <p>敬请期待</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
